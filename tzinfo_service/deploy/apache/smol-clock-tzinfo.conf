# Requires mod_proxy and mod_proxy_http.
# Apache terminates HTTPS; Gunicorn is reachable only through this Unix socket.
# Apache appends the client's address to X-Forwarded-For. With
# TZINFO_TRUST_PROXY=1 the service takes the last address in the header,
# the one Apache added, so a client-supplied header cannot stand in for it.

ProxyPass        "/smol_clock/api/v1/" "unix:/run/smol-clock-tzinfo/gunicorn.sock|http://localhost/smol_clock/api/v1/"
ProxyPassReverse "/smol_clock/api/v1/" "unix:/run/smol-clock-tzinfo/gunicorn.sock|http://localhost/smol_clock/api/v1/"

# nginx example for the Smol Clock tzinfo service.
# nginx terminates HTTPS and proxies only the public API prefix to Gunicorn
# over the filesystem-protected Unix socket.
#
# This example assumes nginx is the public edge server. X-Forwarded-For is
# overwritten with $remote_addr. The service takes the last address in the
# header when TZINFO_TRUST_PROXY=1, so appending ($proxy_add_x_forwarded_for)
# would be safe too.

upstream smol_clock_tzinfo {
    server unix:/run/smol-clock-tzinfo/gunicorn.sock;
    keepalive 4;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name rubidium.darksky.io;

    # Replace these paths with the certificate locations used on the host.
    ssl_certificate     /etc/letsencrypt/live/rubidium.darksky.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rubidium.darksky.io/privkey.pem;

    location /smol_clock/api/v1/ {
        proxy_pass http://smol_clock_tzinfo;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The service takes the last X-Forwarded-For address when
        # TZINFO_TRUST_PROXY=1: this one.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}

# Optional HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;

    server_name rubidium.darksky.io;

    return 301 https://$host$request_uri;
}
